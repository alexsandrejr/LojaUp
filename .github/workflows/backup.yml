# Backup diário dos dados do Supabase, guardado no ramo "backups" deste repositório (backup/lojaup-backup.json).
# Precisa do secret DATABASE_URL (Settings › Secrets and variables › Actions). Veja PUBLICAR.md.
# Sem o secret, não faz nada. Em repositório público, recusa: o backup tem dados de clientes.
name: Backup diário

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 no horário de Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Confere o repositório
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL não configurado neste repositório: nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::Este repositório é PÚBLICO. O backup tem dados de clientes e só é gravado em repositório privado (Settings › General › Danger Zone › Change visibility)."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev
        if: steps.check.outputs.skip != 'true'

      - name: Exporta os dados
        if: steps.check.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup.js "$RUNNER_TEMP/lojaup-backup.json"

      - name: Guarda no ramo backups
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "Backup LojaUp"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin backups; then
            git switch -c backups FETCH_HEAD
          else
            git switch --orphan backups
          fi
          mkdir -p backup
          cp "$RUNNER_TEMP/lojaup-backup.json" backup/lojaup-backup.json
          git add backup/lojaup-backup.json
          git commit -m "Backup $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')" || echo "Nada mudou desde o último backup"
          git push origin backups
